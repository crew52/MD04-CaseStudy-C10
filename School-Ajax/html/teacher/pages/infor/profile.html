<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Tin Cá Nhân</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    .id-card {
      width: 350px;
      height: 450px;
      border: 2px solid #007bff;
      border-radius: 10px;
      padding: 20px;
      background-color: #f8f9fa;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .id-card-header {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 20px;
    }
    .id-card-info {
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .edit-form {
      display: none;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
  <!-- Load Sidebar -->
  <div id="sidebar"></div>

  <!-- Nội dung chính -->
  <div id="content" class="flex-grow-1 p-3">
    <h3>Thông Tin Cá Nhân</h3>
    <div class="row">
      <!-- Thẻ chứng minh thư (bên trái) -->
      <div class="col-md-4">
        <div class="id-card">
          <div class="id-card-header">THẺ GIÁO VIÊN</div>
          <div class="id-card-info"><strong>Họ tên:</strong> <span id="cardName"></span></div>
          <div class="id-card-info"><strong>Ngày sinh:</strong> <span id="cardDob"></span></div>
          <div class="id-card-info"><strong>Giới tính:</strong> <span id="cardGender"></span></div>
          <div class="id-card-info"><strong>Số điện thoại:</strong> <span id="cardPhone"></span></div>
          <div class="id-card-info"><strong>Email:</strong> <span id="cardEmail"></span></div>
          <div class="id-card-info"><strong>Bộ môn:</strong> <span id="cardSubject"></span></div>
          <div class="id-card-info"><strong>Tên đăng nhập:</strong> <span id="cardUsername"></span></div>
        </div>
      </div>

      <!-- Form chỉnh sửa (bên phải) -->
      <div class="col-md-8">
        <button class="btn btn-warning mb-3" id="editButton" onclick="toggleEditForm()">Chỉnh sửa</button>
        <div class="card edit-form" id="editForm">
          <div class="card-header">Chỉnh sửa thông tin</div>
          <div class="card-body">
            <form id="teacherProfileForm">
              <div class="mb-3">
                <label for="teacherName" class="form-label">Họ tên</label>
                <input type="text" class="form-control" id="teacherName">
              </div>
              <div class="mb-3">
                <label for="teacherDob" class="form-label">Ngày sinh</label>
                <input type="date" class="form-control" id="teacherDob">
              </div>
              <div class="mb-3">
                <label for="teacherGender" class="form-label">Giới tính</label>
                <select class="form-control" id="teacherGender">
                  <option value="MALE">Nam</option>
                  <option value="FEMALE">Nữ</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="teacherPhone" class="form-label">Số điện thoại</label>
                <input type="text" class="form-control" id="teacherPhone">
              </div>
              <div class="mb-3">
                <label for="teacherEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="teacherEmail">
              </div>

              <button type="button" class="btn btn-primary" onclick="updateTeacherProfile()">Lưu</button>
              <button type="button" class="btn btn-secondary" onclick="toggleEditForm()">Hủy</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/teacher/loadComponents.js"></script>
<script src="../../../../js/admin/teacherProfile.js"></script>
</body>
</html>
