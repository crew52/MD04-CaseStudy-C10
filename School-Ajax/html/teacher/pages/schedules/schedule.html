
<!DOCTYPE html>
<html lang="vi">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div id="header"></div>

<div class="d-flex">

        <thead>
        <tr>

            <th>Lớp</th>

            <th>Ngày trong tuần</th>
            <th>Ngày</th>
            <th>Giờ bắt đầu</th>
            <th>Giờ kết thúc</th>
        </tr>
        </thead>
        <tbody>
        <!-- Dữ liệu sẽ được thêm vào đây -->
        </tbody>
    </table>
    </div>
</div>
</div>

<!-- Load Footer -->
<div id="footer"></div>
