<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lớp Chủ nhiệm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .class-link {
            cursor: pointer;
            color: #007bff;
            text-decoration: underline;
        }
        .class-link:hover {
            color: #0056b3;
        }
        #studentTable {
            display: none; /* Ẩn bảng học sinh ban đầu */
        }
    </style>
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>

    <!-- Nội dung chính -->
    <div id="content" class="flex-grow-1 p-3">
        <h3>Quản lý Lớp Chủ nhiệm</h3>

        <!-- Thông tin giáo viên chủ nhiệm và lớp -->
        <div id="teacherInfo" class="mb-3">
            <p><strong>Giáo viên chủ nhiệm:</strong> <span id="teacherName"></span></p>
            <p><strong>Lớp chủ nhiệm:</strong> <span id="className" class="class-link"></span></p>
        </div>

        <!-- Bảng danh sách học sinh -->
        <table id="studentTable" class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Ngày Sinh</th>
                <th>Giới Tính</th>
                <th>Liên Hệ Phụ Huynh</th>
            </tr>
            </thead>
            <tbody id="studentTableBody">
            <!-- Dữ liệu học sinh sẽ được chèn vào đây -->
            </tbody>
        </table>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/teacher/loadComponents.js"></script>
<script src="../../../../js/teacher/homeroomManagement.js"></script>
</body>
</html>
