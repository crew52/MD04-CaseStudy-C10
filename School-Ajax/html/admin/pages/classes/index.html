<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lớp học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>

    <!-- Nội dung chính -->
    <div id="content" class="flex-grow-1 p-3">
        <h3>Quản lý Lớp học</h3>

        <h1 class="text-center mb-4" id="name"></h1>

        <!-- Nút mở modal để thêm lớp -->
        <div class="mb-4">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#classModal" onclick="prepareAddClass()">
                <i class="fas fa-plus"></i> Thêm Lớp học
            </button>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-header">Tìm Kiếm Lớp học</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="searchClassName" placeholder="Nhập tên lớp">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary" onclick="searchClasses()">Tìm Kiếm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bảng danh sách lớp học -->
        <div class="card">
            <div class="card-header">Danh Sách Lớp học</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên Lớp</th>
                        <th>Cấp Độ</th>
                        <th>Giáo Viên</th>
                        <th>Hành Động</th>
                    </tr>
                    </thead>
                    <tbody id="classTableBody"></tbody>
                </table>

                <!-- Phân trang -->
                <div class="row">
                    <div class="col-md-6">
                        <button class="btn btn-secondary" onclick="changePage(-1)">Trang Trước</button>
                        <span id="pageInfo" class="mx-2"></span>
                        <button class="btn btn-secondary" onclick="changePage(1)">Trang Sau</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal cho Thêm/Cập nhật Lớp học -->
        <div class="modal fade" id="classModal" tabindex="-1" aria-labelledby="classModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="classModalLabel">Thêm/Cập Nhật Lớp học</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="classForm">
                            <input type="hidden" id="classId" name="id">
                            <div class="mb-3">
                                <label for="className" class="form-label">Tên Lớp</label>
                                <input type="text" class="form-control" id="className" name="className" required>
                            </div>
                            <div class="mb-3">
                                <label for="gradeLevel" class="form-label">Cấp Độ</label>
                                <select class="form-control" id="gradeLevel" name="gradeLevel" required>
                                    <option value="GRADE_1">Lớp 1</option>
                                    <option value="GRADE_2">Lớp 2</option>
                                    <option value="GRADE_3">Lớp 3</option>
                                    <option value="GRADE_4">Lớp 4</option>
                                    <option value="GRADE_5">Lớp 5</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="teacherId" class="form-label">ID Giáo viên (Tùy chọn)</label>
                                <input type="number" class="form-control" id="teacherId" name="teacherId">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="saveClass()">Lưu</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/admin/loadComponents.js"></script>
<script src="../../../../js/admin/handleClass.js"></script>
</body>
</html>
