<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lịch học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Sidebar -->
    <div id="sidebar" class="bg-dark text-white p-3">
        <h5>Quản lý</h5>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="../schedules/index.html" class="nav-link text-white page-link mb-2">
                    <i class="fa fa-calendar-alt"></i> Thời khóa biểu
                </a>
            </li>
        </ul>
    </div>

    <!-- Nội dung chính -->
    <div id="content" class="flex-grow-1 p-3">
        <h3>Quản lý Lịch học</h3>

        <!-- Nút mở modal -->
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#scheduleModal">
            + Thêm Lịch Học
        </button>

        <table class="table table-bordered">
            <thead>
            <tr>
                <th>STT</th>
                <th>Lớp</th>
                <th>Môn học</th>
                <th>Giáo viên</th>
                <th>Thời gian</th>
            </tr>
            </thead>
            <tbody id="scheduleTable">
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scheduleModalLabel">Thêm Lịch Học</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="scheduleId">

                <label for="className">Lớp:</label>
                <input type="text" id="className" class="form-control">

                <label for="subjectName">Môn học:</label>
                <input type="text" id="subjectName" class="form-control">

                <label for="teacherName">Giáo viên:</label>
                <input type="text" id="teacherName" class="form-control">

                <label for="dayOfWeek">Thời gian:</label>
                <input type="text" id="dayOfWeek" class="form-control">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button class="btn btn-success" onclick="saveSchedule()">Lưu</button>
            </div>
        </div>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/admin/loadComponents.js"></script>
<script src="loadSchedules.js"></script>

</body>
</html>
