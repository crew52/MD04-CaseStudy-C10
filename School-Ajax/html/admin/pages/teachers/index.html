
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giáo viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>

    <!-- Nội dung chính -->
    <div id="content" class="flex-grow-1 p-3">
        <div class="container mt-5">
            <h2 class="mb-4">Teacher Management</h2>

            <!-- Tìm kiếm theo tên và môn học -->
            <div class="row mb-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchName" placeholder="Enter teacher name" onkeypress="if(event.key === 'Enter') searchTeachers()">
                        <button class="btn btn-outline-primary" onclick="searchTeachers()">Search</button>
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-control" id="searchSubject" onchange="searchTeachers()">
                        <option value="">All Subjects</option>
                        <option value="MATHEMATICS">Mathematics</option>
                        <option value="VIETNAMESE_LANGUAGE">Vietnamese Language</option>
                        <option value="ENGLISH">English</option>
                        <option value="SCIENCE">Science</option>
                        <option value="HISTORY">History</option>
                        <option value="GEOGRAPHY">Geography</option>
                        <option value="ETHICS">Ethics</option>
                        <option value="PHYSICAL_EDUCATION">Physical Education</option>
                        <option value="MUSIC">Music</option>
                        <option value="ART">Art</option>
                        <option value="COMPUTER_SCIENCE">Computer Science</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-secondary" onclick="resetSearch()">Reset</button>
                </div>
            </div>

            <!-- Nút thêm giáo viên -->
            <button class="btn btn-primary mb-3" onclick="openAddModal()">Add New Teacher</button>

            <!-- Bảng danh sách giáo viên -->
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>DOB</th>
                    <th>Gender</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Subject</th>
                    <th>User</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="teacherTableBody"></tbody>
            </table>

            <!-- Phân trang -->
            <nav>
                <ul class="pagination" id="pagination"></ul>
            </nav>
        </div>

        <!-- Modal thêm/sửa giáo viên -->
        <div class="modal fade" id="teacherModal" tabindex="-1" aria-labelledby="teacherModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="teacherModalLabel">Add/Edit Teacher</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="teacherForm">
                            <input type="hidden" id="teacherId">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="dob" required>
                            </div>
                            <div class="mb-3">
                                <label for="gender" class="form-label">Gender</label>
                                <select class="form-control" id="gender" required>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" required>
                            </div>
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <select class="form-control" id="subject" required>
                                    <option value="1">MATHEMATICS</option>
                                    <option value="2">VIETNAMESE_LANGUAGE</option>
                                    <option value="3">ENGLISH</option>
                                    <option value="4">SCIENCE</option>
                                    <option value="5">HISTORY</option>
                                    <option value="6">GEOGRAPHY</option>
                                    <option value="7">ETHICS</option>
                                    <option value="8">PHYSICAL_EDUCATION</option>
                                    <option value="9">MUSIC</option>
                                    <option value="10">ART</option>
                                    <option value="11">COMPUTER_SCIENCE</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" onclick="saveTeacher()">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal tạo User mới -->
        <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="userModalLabel">Create New User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="userForm">
                            <input type="hidden" id="teacherIdForUser">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select class="form-control" id="role" required>
                                    <option value="1">TEACHER</option>
                                    <!-- Thêm các role khác nếu cần -->
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary" onclick="createUserForTeacher()">Create User</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/teacher/loadComponents.js"></script>
<script src="../../../../js/teacher/handleTeacher.js"></script>


</body>
</html>
