<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Lịch học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>

    <!-- Nội dung chính -->
    <div id="content" class="flex-grow-1 p-3">
        <h3>Quản lý Học Sinh</h3>

        <!-- Form Thêm/Sửa Học Sinh -->
        <div class="card mb-4">
            <div class="card-header">Thêm/Cập Nhật Học Sinh</div>
            <div class="card-body">
                <form id="studentForm">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <input type="hidden" id="studentId" name="id">
                            <label for="studentName" class="form-label">Tên Học Sinh</label>
                            <input type="text" class="form-control" id="studentName" name="name" required>
                        </div>
                        <div class="col-md-4">
                            <label for="dob" class="form-label">Ngày Sinh</label>
                            <input type="date" class="form-control" id="dob" name="dob" required>
                        </div>
                        <div class="col-md-4">
                            <label for="gender" class="form-label">Giới Tính</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="MALE">Nam</option>
                                <option value="FEMALE">Nữ</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="classId" class="form-label">Lớp</label>
                            <select class="form-select" id="classId" name="classId" required>
                                <!-- Dữ liệu lớp sẽ được tải bằng AJAX -->
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="parentContact" class="form-label">Liên Hệ Phụ Huynh</label>
                            <input type="text" class="form-control" id="parentContact" name="parentContact" required>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-primary mt-4" onclick="saveStudent()">Lưu</button>
                            <button type="button" class="btn btn-secondary mt-4" onclick="clearForm()">Hủy</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-header">Tìm Kiếm Học Sinh</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchName" placeholder="Tên học sinh">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="searchClassName" placeholder="Tên lớp">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary" onclick="searchStudents()">Tìm Kiếm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Student Table -->
        <div class="card">
            <div class="card-header">Danh Sách Học Sinh</div>
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Ngày Sinh</th>
                        <th>Giới Tính</th>
                        <th>Lớp</th>
                        <th>Liên Hệ Phụ Huynh</th>
                        <th>Hành Động</th>
                    </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table>

                <!-- Pagination -->
                <div class="row">
                    <div class="col-md-6">
                        <button class="btn btn-secondary" onclick="changePage(-1)">Trang Trước</button>
                        <span id="pageInfo" class="mx-2"></span>
                        <button class="btn btn-secondary" onclick="changePage(1)">Trang Sau</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/admin/loadComponents.js"></script>
