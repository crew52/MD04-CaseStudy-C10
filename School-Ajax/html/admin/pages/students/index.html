
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .search-bar {
            width: 50%;
        }

        .table-container {
            margin-top: 20px;
        }

        .student-form {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .hidden {
            display: none;
        }

        .add-btn {
            margin-left: 10px;
        }
    </style>
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>


    <div id="content" class="flex-grow-1 p-3">
        <div class="content-header">
            <h3>Quản lý Học sinh</h3>
            <div class="d-flex align-items-center">
                <div class="search-bar input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm học sinh theo tên...">
                    <button class="btn btn-primary" onclick="searchStudents()">
                        <i class="fa fa-search"></i> Tìm kiếm
                    </button>
                </div>
                <!-- Nút Thêm học sinh -->
                <button class="btn btn-success add-btn" onclick="showAddForm()">
                    <i class="fa fa-plus"></i> Thêm học sinh
                </button>
            </div>
        </div>

        <!-- Khu vực hiển thị nội dung động -->
        <div id="dynamicContent">
            <!-- Danh sách học sinh (mặc định) -->
            <div id="studentList" class="table-container">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Tên</th>
                        <th>Ngày sinh</th>
                        <th>Giới tính</th>
                        <th>Lớp</th>
                        <th>Hành động</th>
                    </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    <tr>
                        <td>1</td>
                        <td>Nguyen Van A</td>
                        <td>2010-05-15</td>
                        <td>Nam</td>
                        <td>10A1</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="showEditForm(1)">
                                <i class="fa fa-edit"></i> Sửa
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteStudent(1)">
                                <i class="fa fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Tran Thi B</td>
                        <td>2011-03-20</td>
                        <td>Nữ</td>
                        <td>10A2</td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="showEditForm(2)">
                                <i class="fa fa-edit"></i> Sửa
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteStudent(2)">
                                <i class="fa fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Form thêm/sửa học sinh (ẩn mặc định) -->
            <div id="studentForm" class="student-form hidden">
                <h4 id="formTitle">Thêm học sinh mới</h4>
                <form id="addEditForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Tên:</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="dob" class="form-label">Ngày sinh:</label>
                        <input type="date" class="form-control" id="dob" required>
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label">Giới tính:</label>
                        <select class="form-select" id="gender" required>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="class" class="form-label">Lớp:</label>
                        <input type="text" class="form-control" id="class" required>
                    </div>
                    <input type="hidden" id="studentId">
                    <button type="button" class="btn btn-success" onclick="saveStudent()">Lưu</button>
                    <button type="button" class="btn btn-secondary" onclick="showStudentList()">Hủy</button>
                </form>
            </div>
        </div>
    </div>
</div>
    


</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../../js/admin/loadComponents.js"></script>

</body>
</html>
