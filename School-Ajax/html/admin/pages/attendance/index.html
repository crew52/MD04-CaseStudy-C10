<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Điểm danh học sinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<!-- Load Header -->
<div id="header"></div>

<div class="d-flex">
    <!-- Load Sidebar -->
    <div id="sidebar"></div>

    <!-- Nội dung chính -->
    <div class="container mt-4">
        <h3 class="text-primary">Quản lý Điểm danh học sinh</h3>
        <p class="text-muted">Danh sách điểm danh của học sinh</p>

        <h1 class="text-center mb-4" id="name"></h1>

        <!-- Form tìm kiếm -->
        <div class="card p-3 mb-3 shadow-sm">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="className" class="form-control" placeholder="Class Name">
                </div>
                <div class="col-md-3">
                    <input type="text" id="studentName" class="form-control" placeholder="Student Name">
                </div>
                <div class="text-center mt-3">
                    <button class="btn btn-primary" onclick="searchAttendances()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>

            <!-- Bảng danh sách điểm danh -->
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Học sinh</th>
                        <th>Lớp</th>
                        <th>Môn học</th>
                        <th>Giáo viên</th>
                        <th>Trạng thái</th>
                        <th>Ngày</th>
                        <th>Giờ học</th>
                    </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                    <!-- Dữ liệu sẽ được load ở đây -->
                    </tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="prevPage" class="btn btn-outline-primary" onclick="changePage(-1)">
                    <i class="fas fa-angle-left"></i> Previous
                </button>
                <span id="currentPage" class="fw-bold">Page 1</span>
                <button id="nextPage" class="btn btn-outline-primary" onclick="changePage(1)">
                    Next <i class="fas fa-angle-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Load Footer -->
<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../../../../js/admin/loadComponents.js"></script>
<script src="../../../../js/admin/handleAttendance.js"></script>
</body>
</html>
